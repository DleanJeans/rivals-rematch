<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rivals Rematch</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="hd"><b>Rivals Rematch</b><span id="counts" class="dim"></span></div>
  <p id="ver" class="dim" style="margin:-2px 0 6px"></p>
  <p id="where" class="dim">Checking this tab…</p>
  <button id="scan" class="primary" disabled title="Saves the lobby, then also reads every player's hero details">Read &amp; save this lobby</button>
  <div id="result" role="status" aria-live="polite"></div>
  <button id="openall" disabled title="Opens every other player in this lobby in new background tabs. A tab closes itself if that player is not in a Competitive game; otherwise it opens their Live Game and reads it. Shift-click: just open them.">Open all profiles in this lobby</button>
  <button id="details" disabled title="Reads hero details (win rates, proficiency, match history) for players not yet read in this match. Shift-click to read everyone again.">Read hero details</button>
  <div id="auto" class="auto">
    <button id="autotoggle" title="Goes through every saved player slowly, one at a time: opens their profile, and if they are in a Competitive game reads that lobby (new players get saved). Needs no rivalsdata tab open.">Start Auto Discover</button>
    <label class="dim">Wait between players <input id="autodelay" type="number" min="0.1" max="600" step="0.1" value="1"> s</label>
    <label class="dim">Profiles open at once <input id="autoparallel" type="number" min="1" max="10" step="1" value="1"></label>
    <div id="autostatus" class="dim" role="status" aria-live="polite"></div>
  </div>
  <button id="open">Open database</button>
  <button id="savegh" title="Merge with, then push to, data/players.json in your GitHub repo">Save to GitHub</button>
  <button id="savefile" title="Write the database into the repo's data/players.json">Save to data/players.json</button>
  <script src="../lib/shared.js"></script>
  <script src="../lib/store.js"></script>
  <script src="../lib/autoui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
